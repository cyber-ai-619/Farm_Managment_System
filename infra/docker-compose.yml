services:
  backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
    working_dir: /var/www/backend
    command: php -S 0.0.0.0:8000 -t public public/index.php
    ports:
      - '8000:8000'
    volumes:
      - ../backend:/var/www/backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-farm_management}
      DB_USERNAME: ${DB_USERNAME:-farm_user}
      DB_PASSWORD: ${DB_PASSWORD:-farm_password}
    depends_on:
      - db

  frontend:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-farm_management}
      MYSQL_USER: ${DB_USERNAME:-farm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-farm_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - farm_db_data:/var/lib/mysql

volumes:
  farm_db_data:
